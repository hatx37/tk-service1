<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Verification - Service Maintenance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="password-page">
    <!-- Header Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                   <img src="your-logo.png" alt="Company Logo" class="logo-img">
                </div>
                <nav class="nav-desktop">
                    <a href="index.html#hero" class="nav-link">Home</a>
                    <a href="index.html#service" class="nav-link">Service Report</a>
                    <a href="index.html#contact" class="nav-link">Contact Us</a>
                </nav>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <nav class="nav-mobile" id="mobileMenu">
                <a href="index.html#hero" class="nav-link">Home</a>
                <a href="index.html#service" class="nav-link">Service Report</a>
                <a href="index.html#contact" class="nav-link">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- Password Section -->
    <section class="hero">
        <div class="container">
            <div class="password-container">
                <h1 class="title">Service Maintenance</h1>
                <p class="company-name" id="companyDisplay">Loading...</p>
                
                <form id="passwordForm" class="password-form">
                    <label for="passwordInput" style="color: white; font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem;">
                        Enter Password
                    </label>
                    
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="passwordInput" 
                            placeholder="Password..." 
                            autocomplete="off"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            👁️
                        </button>
                    </div>
                    
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    
                    <div id="helpSection" class="help-section" style="display: none;">
                        <p style="font-weight: 600; margin-bottom: 0.5rem;">Need help?</p>
                        <p style="margin-bottom: 0.5rem;">If you've forgotten your password or need assistance, please contact us:</p>
                        <button type="button" class="whatsapp-button" id="whatsappBtn">
                            💬 Contact Support
                        </button>
                    </div>
                    
                    <button type="submit" class="submit-button" id="submitBtn">
                        SUBMIT
                    </button>
                    
                    <button type="button" class="request-password-button" id="requestPasswordBtn">
                    🔑 Request Password
                    </button>
                    
                    <button type="button" class="back-button" onclick="window.location.href='index.html'">
                        BACK
                    </button>
                </form>
            </div>
        </div>
    </section>




    <script src="company-data.js"></script>
    <script>
        console.log('📅 Date selection loaded');
        console.log('🔍 Checking what data is available...');
        console.log('typeof companyData:', typeof companyData);
        console.log('typeof window.companyData:', typeof window.companyData);
        console.log('typeof window.COMPANY_DATA:', typeof window.COMPANY_DATA);

        let companyName = '';
        let companyInfo = null;

        function init() {
            console.log('🚀 Initializing date selection page...');
            
            companyName = localStorage.getItem('selectedCompany');
            const verified = localStorage.getItem('passwordVerified');

            console.log('Company name:', companyName);
            console.log('Verified:', verified);

            if (!companyName || verified !== 'true') {
                alert('Please complete password verification first');
                window.location.href = 'index.html';
                return;
            }

            // Try to get company data from different sources
            const DATA = window.COMPANY_DATA || window.companyData || companyData;
            
            if (typeof DATA === 'undefined') {
                console.error('❌ Company data not loaded!');
                showError('Company data not loaded. Please refresh the page.');
                return;
            }

            console.log('✅ Data loaded:', Object.keys(DATA).length, 'companies');
            console.log('Available companies:', Object.keys(DATA));

            companyInfo = DATA[companyName];
            
            if (!companyInfo) {
                console.error('❌ Company not found:', companyName);
                showError('Company not found: ' + companyName);
                return;
            }

            console.log('✅ Company info loaded:', companyInfo);

            displayCompanyInfo();
            displayDates();
            setupEvents();
        }

        function displayCompanyInfo() {
            console.log('📝 Displaying company info...');
            
            document.getElementById('companyName').textContent = companyName;
            
            const lastDate = companyInfo.lastServiceDate || 'N/A';
            const nextDate = companyInfo.nextServiceDate || 'N/A';
            
            console.log('Last service date:', lastDate);
            console.log('Next service date:', nextDate);
            
            document.getElementById('lastServiceDate').textContent = lastDate;
            document.getElementById('nextServiceDate').textContent = nextDate;
        }

        function displayDates() {
            console.log('📅 Displaying service dates...');
            
            const container = document.getElementById('datesContainer');
            
            // Check for serviceDates (new structure)
            const serviceDates = companyInfo.serviceDates || companyInfo.serviceData || {};
            
            console.log('Service dates object:', serviceDates);
            console.log('Number of dates:', Object.keys(serviceDates).length);
            
            if (Object.keys(serviceDates).length === 0) {
                console.warn('⚠️ No service dates available');
                container.innerHTML = '<div class="error">No service dates available for this company</div>';
                return;
            }

            const dates = Object.keys(serviceDates).sort();
            console.log('Sorted dates:', dates);

            container.innerHTML = '<div class="dates-grid">' + 
                dates.map(date => {
                    console.log('Creating card for date:', date);
                    return `
                        <div class="date-card" data-date="${date}">
                            <div class="date-text">📅 ${date}</div>
                        </div>
                    `;
                }).join('') + 
            '</div>';

            document.querySelectorAll('.date-card').forEach(card => {
                card.addEventListener('click', () => {
                    const date = card.dataset.date;
                    selectDate(date);
                });
            });

            console.log('✅ Date cards created successfully');
        }

        function selectDate(date) {
            console.log('✅ Selected date:', date);
            localStorage.setItem('selectedDate', date);
            window.location.href = 'fan-selection.html';
        }

        function setupEvents() {
            document.getElementById('backBtn').addEventListener('click', () => {
                localStorage.removeItem('passwordVerified');
                window.location.href = 'password.html';
            });
        }

        function showError(msg) {
            console.error('❌ Error:', msg);
            document.getElementById('datesContainer').innerHTML = 
                `<div class="error">${msg}</div>`;
        }

        // Wait for DOM and data to load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
