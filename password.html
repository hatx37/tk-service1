<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Verification - Service Maintenance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="password-page">
    <!-- Header Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                   <img src="your-logo.png" alt="Company Logo" class="logo-img">
                </div>
                <nav class="nav-desktop">
                    <a href="index.html#hero" class="nav-link">Home</a>
                    <a href="index.html#service" class="nav-link">Service Report</a>
                    <a href="index.html#contact" class="nav-link">Contact Us</a>
                </nav>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <nav class="nav-mobile" id="mobileMenu">
                <a href="index.html#hero" class="nav-link">Home</a>
                <a href="index.html#service" class="nav-link">Service Report</a>
                <a href="index.html#contact" class="nav-link">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- Password Section -->
    <section class="hero">
        <div class="container">
            <div class="password-container">
                <h1 class="title">Service Maintenance</h1>
                <p class="company-name" id="companyDisplay">Loading...</p>
                
                <form id="passwordForm" class="password-form">
                    <label for="passwordInput" style="color: white; font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem;">
                        Enter Password
                    </label>
                    
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="passwordInput" 
                            placeholder="Password..." 
                            autocomplete="off"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            👁️
                        </button>
                    </div>
                    
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    
                    <div id="helpSection" class="help-section" style="display: none;">
                        <p style="font-weight: 600; margin-bottom: 0.5rem;">Need help?</p>
                        <p style="margin-bottom: 0.5rem;">If you've forgotten your password or need assistance, please contact us:</p>
                        <button type="button" class="whatsapp-button" id="whatsappBtn">
                            💬 Contact Support
                        </button>
                    </div>
                    
                    <button type="submit" class="submit-button" id="submitBtn">
                        SUBMIT
                    </button>
                    
                    <button type="button" class="request-password-button" id="requestPasswordBtn">
                    🔑 Request Password
                    </button>
                    
                    <button type="button" class="back-button" onclick="window.location.href='index.html'">
                        BACK
                    </button>
                </form>
            </div>
        </div>


  <!-- Load company data first -->
  <script src="company-data.js"></script>

  <!-- Inline script (or link to password.js) -->
  <script>
    // Helper normalization
    function normalizeCompany(name) {
      if (!name) return null;
      return name.trim().toUpperCase();
    }

    // Get company name from localStorage
    const rawCompanyName = localStorage.getItem('companyName');
    const companyName = rawCompanyName || '';
    const normalized = normalizeCompany(companyName);

    const companyDisplay = document.getElementById('companyDisplay');
    const passwordForm = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const helpSection = document.getElementById('helpSection');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const requestPasswordBtn = document.getElementById('requestPasswordBtn');

    // Show company
    companyDisplay.textContent = companyName || '(no company selected)';

    if (!companyName) {
      alert('No company selected. Redirecting to start.');
      window.location.href = 'index.html'; // your home page
    }

    // Request password button (opens a Google Form - adjust URL)
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/1yH_2bKzrs_bvN3RWuB_T6vcAAIpBgx6eurnNowMvK10/edit';
    requestPasswordBtn.addEventListener('click', () => window.open(GOOGLE_FORM_URL, '_blank'));

    // WhatsApp support
    whatsappBtn.addEventListener('click', () => {
      const phone = '601118769339'; // adjust
      const message = `Hello, I need help accessing the service reports for ${companyName}. I'm having trouble with the password.`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    });

    // Password check
    passwordForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorMessage.style.display = 'none';
      const entered = passwordInput.value.trim();
      if (!entered) {
        showError('Please enter a password.');
        return;
      }

      // Lookup password in global companyPasswords (from company-data.js)
      if (typeof companyPasswords === 'undefined') {
        showError('Company passwords data not loaded. Check that company-data.js is before this script.');
        return;
      }

      // Normalize company key to match stored keys (companyPasswords keys are exact uppercase names)
      const companyKey = normalizeCompany(companyName);
      const stored = companyPasswords[companyKey] || companyPasswords[companyName] || null;

      if (!stored) {
        showError('Company not found in records.');
        return;
      }

      if (stored.password === entered) {
        // success
        localStorage.setItem('passwordVerified', 'true');
        // When you go to date-selection page, it will read companyName from localStorage
        window.location.href = 'date-selection.html';
      } else {
        showError('Incorrect password. Please try again.');
        helpSection.style.display = 'block';
      }
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = 'block';
    }
  </script>
</body>

</html>
