<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0C7EB2 0%, #00ABEC 50%, #00A2E2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0C7EB2;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .company-info {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #0C7EB2;
            margin-bottom: 30px;
        }

        .company-info h2 {
            color: #0C7EB2;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .date-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .date-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .date-item label {
            color: #666;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        .date-item span {
            color: #0C7EB2;
            font-size: 18px;
            font-weight: bold;
        }

        .dates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .date-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .date-card:hover {
            border-color: #0C7EB2;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(12, 126, 178, 0.2);
        }

        .date-card .date-text {
            color: #0C7EB2;
            font-size: 16px;
            font-weight: bold;
        }

        .back-btn {
            width: 100%;
            padding: 15px;
            background: white;
            color: #0C7EB2;
            border: 2px solid #0C7EB2;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #f0f9ff;
        }

        .loading, .error {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        .loading {
            color: #0C7EB2;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
            border-radius: 10px;
        }

        @media (max-width: 640px) {
            .date-info {
                grid-template-columns: 1fr;
            }
            
            .dates-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Select Service Date</h1>
        </div>

        <div class="company-info">
            <h2 id="companyName">Loading...</h2>
            <div class="date-info">
                <div class="date-item">
                    <label>Last Service Date:</label>
                    <span id="lastServiceDate">-</span>
                </div>
                <div class="date-item">
                    <label>Next Service Date:</label>
                    <span id="nextServiceDate">-</span>
                </div>
            </div>
        </div>

        <div id="datesContainer"></div>

        <button id="backBtn" class="back-btn">← BACK TO PASSWORD</button>
    </div>

    <script src="company-data.js"></script>
    <script>
        console.log('📅 Date selection loaded');
        console.log('🔍 Checking what data is available...');
        console.log('typeof companyData:', typeof companyData);
        console.log('typeof window.companyData:', typeof window.companyData);
        console.log('typeof window.COMPANY_DATA:', typeof window.COMPANY_DATA);

        let companyName = '';
        let companyInfo = null;

        function init() {
            console.log('🚀 Initializing date selection page...');
            
            companyName = localStorage.getItem('selectedCompany');
            const verified = localStorage.getItem('passwordVerified');

            console.log('Company name:', companyName);
            console.log('Verified:', verified);

            if (!companyName || verified !== 'true') {
                alert('Please complete password verification first');
                window.location.href = 'index.html';
                return;
            }

            // Try to get company data from different sources
            const DATA = window.COMPANY_DATA || window.companyData || companyData;
            
            if (typeof DATA === 'undefined') {
                console.error('❌ Company data not loaded!');
                showError('Company data not loaded. Please refresh the page.');
                return;
            }

            console.log('✅ Data loaded:', Object.keys(DATA).length, 'companies');
            console.log('Available companies:', Object.keys(DATA));

            companyInfo = DATA[companyName];
            
            if (!companyInfo) {
                console.error('❌ Company not found:', companyName);
                showError('Company not found: ' + companyName);
                return;
            }

            console.log('✅ Company info loaded:', companyInfo);

            displayCompanyInfo();
            displayDates();
            setupEvents();
        }

        function displayCompanyInfo() {
            console.log('📝 Displaying company info...');
            
            document.getElementById('companyName').textContent = companyName;
            
            const lastDate = companyInfo.lastServiceDate || 'N/A';
            const nextDate = companyInfo.nextServiceDate || 'N/A';
            
            console.log('Last service date:', lastDate);
            console.log('Next service date:', nextDate);
            
            document.getElementById('lastServiceDate').textContent = lastDate;
            document.getElementById('nextServiceDate').textContent = nextDate;
        }

        function displayDates() {
            console.log('📅 Displaying service dates...');
            
            const container = document.getElementById('datesContainer');
            
            // Check for serviceDates (new structure)
            const serviceDates = companyInfo.serviceDates || companyInfo.serviceData || {};
            
            console.log('Service dates object:', serviceDates);
            console.log('Number of dates:', Object.keys(serviceDates).length);
            
            if (Object.keys(serviceDates).length === 0) {
                console.warn('⚠️ No service dates available');
                container.innerHTML = '<div class="error">No service dates available for this company</div>';
                return;
            }

            const dates = Object.keys(serviceDates).sort();
            console.log('Sorted dates:', dates);

            container.innerHTML = '<div class="dates-grid">' + 
                dates.map(date => {
                    console.log('Creating card for date:', date);
                    return `
                        <div class="date-card" data-date="${date}">
                            <div class="date-text">📅 ${date}</div>
                        </div>
                    `;
                }).join('') + 
            '</div>';

            document.querySelectorAll('.date-card').forEach(card => {
                card.addEventListener('click', () => {
                    const date = card.dataset.date;
                    selectDate(date);
                });
            });

            console.log('✅ Date cards created successfully');
        }

        function selectDate(date) {
            console.log('✅ Selected date:', date);
            localStorage.setItem('selectedDate', date);
            window.location.href = 'fan-selection.html';
        }

        function setupEvents() {
            document.getElementById('backBtn').addEventListener('click', () => {
                localStorage.removeItem('passwordVerified');
                window.location.href = 'password.html';
            });
        }

        function showError(msg) {
            console.error('❌ Error:', msg);
            document.getElementById('datesContainer').innerHTML = 
                `<div class="error">${msg}</div>`;
        }

        // Wait for DOM and data to load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>

  <!-- Load company data first -->
  <script src="company-data.js"></script>

  <!-- Inline script (or link to password.js) -->
  <script>
    // Helper normalization
    function normalizeCompany(name) {
      if (!name) return null;
      return name.trim().toUpperCase();
    }

    // Get company name from localStorage
    const rawCompanyName = localStorage.getItem('companyName');
    const companyName = rawCompanyName || '';
    const normalized = normalizeCompany(companyName);

    const companyDisplay = document.getElementById('companyDisplay');
    const passwordForm = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const helpSection = document.getElementById('helpSection');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const requestPasswordBtn = document.getElementById('requestPasswordBtn');

    // Show company
    companyDisplay.textContent = companyName || '(no company selected)';

    if (!companyName) {
      alert('No company selected. Redirecting to start.');
      window.location.href = 'index.html'; // your home page
    }

    // Request password button (opens a Google Form - adjust URL)
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/1yH_2bKzrs_bvN3RWuB_T6vcAAIpBgx6eurnNowMvK10/edit';
    requestPasswordBtn.addEventListener('click', () => window.open(GOOGLE_FORM_URL, '_blank'));

    // WhatsApp support
    whatsappBtn.addEventListener('click', () => {
      const phone = '601118769339'; // adjust
      const message = `Hello, I need help accessing the service reports for ${companyName}. I'm having trouble with the password.`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    });

    // Password check
    passwordForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorMessage.style.display = 'none';
      const entered = passwordInput.value.trim();
      if (!entered) {
        showError('Please enter a password.');
        return;
      }

      // Lookup password in global companyPasswords (from company-data.js)
      if (typeof companyPasswords === 'undefined') {
        showError('Company passwords data not loaded. Check that company-data.js is before this script.');
        return;
      }

      // Normalize company key to match stored keys (companyPasswords keys are exact uppercase names)
      const companyKey = normalizeCompany(companyName);
      const stored = companyPasswords[companyKey] || companyPasswords[companyName] || null;

      if (!stored) {
        showError('Company not found in records.');
        return;
      }

      if (stored.password === entered) {
        // success
        localStorage.setItem('passwordVerified', 'true');
        // When you go to date-selection page, it will read companyName from localStorage
        window.location.href = 'date-selection.html';
      } else {
        showError('Incorrect password. Please try again.');
        helpSection.style.display = 'block';
      }
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = 'block';
    }
  </script>
</body>

</html>
