<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Fan Report</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for fan selection grid */
        .fans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .fan-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 2rem 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: white;
            font-family: inherit;
        }

        .fan-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .fan-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .fan-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .fan-action {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .no-fans {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 2rem;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .fans-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="password-page">
    <!-- Header Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="your-logo.png" alt="Company Logo" class="logo-img">
                </div>
                <nav class="nav-desktop">
                    <a href="index.html#hero" class="nav-link">Home</a>
                    <a href="index.html#service" class="nav-link">Service Report</a>
                    <a href="index.html#contact" class="nav-link">Contact Us</a>
                </nav>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <nav class="nav-mobile" id="mobileMenu">
                <a href="index.html#hero" class="nav-link">Home</a>
                <a href="index.html#service" class="nav-link">Service Report</a>
                <a href="index.html#contact" class="nav-link">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- Fan Selection Section -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="container">
            <div class="password-container" style="max-width: 900px;">
                <h1 class="title">Select Fan for Service Report</h1>
                <p class="company-name" id="companyDisplay">Loading company...</p>
                <p class="company-name" id="dateDisplay" style="font-size: 1rem; margin-top: -1rem; margin-bottom: 1rem;">Loading date...</p>
                
                <p style="color: rgba(255, 255, 255, 0.9); text-align: center; margin-bottom: 2rem; font-size: 1rem;">
                    👇 Click on a fan below to view its service report
                </p>

                <!-- Fan Grid - Dynamically populated by JavaScript -->
                <div id="fanGrid" class="fans-grid">
                    <!-- Fan cards will be generated here by fan-selection.js -->
                    <div style="color: rgba(255, 255, 255, 0.7); text-align: center; padding: 2rem;">
                        Loading fans...
                    </div>
                </div>

                <button type="button" onclick="window.location.href='date-selection.html'" class="back-button" style="margin-top: 2rem;">
                    ← BACK TO DATE SELECTION
                </button>
            </div>
        </div>
    </section>

  <script src="company-data.js"></script>

  <script>
    function normalizeCompany(name) { return (name||'').trim().toUpperCase(); }

    function formatDateLabel(dateKey) {
      const d = new Date(dateKey);
      if (!isNaN(d.getTime())) {
        return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
      }
      return dateKey;
    }

    function goBack() {
      window.location.href = 'date-selection.html';
    }

    function viewReport(fanName) {
      const rawCompany = localStorage.getItem('companyName');
      const companyKey = normalizeCompany(rawCompany);
      const selectedDate = localStorage.getItem('selectedServiceDate');

      if (!rawCompany || !selectedDate) {
        alert('Missing info. Please start again.');
        window.location.href = 'index.html';
        return;
      }

      // Look up in companyReportLinks
      const reportsForCompany = companyReportLinks[companyKey] || companyReportLinks[rawCompany];
      if (!reportsForCompany) {
        alert('No reports found for this company.');
        return;
      }

      const dateReports = reportsForCompany[selectedDate];
      if (!dateReports) {
        alert('No reports for selected date. Please choose another date.');
        return;
      }

      const url = dateReports[fanName];
      if (!url || url.includes('YOUR_FILE_ID_HERE')) {
        alert('Report URL not configured for this fan. Contact support.');
        return;
      }

      window.open(url, '_blank');
    }

    // On load: populate
    window.addEventListener('DOMContentLoaded', () => {
      const companyRaw = localStorage.getItem('companyName');
      const selectedDate = localStorage.getItem('selectedServiceDate');
      const fansJSON = localStorage.getItem('fansServiced');

      if (!companyRaw || !selectedDate || !fansJSON) {
        alert('Required data missing. Returning to start.');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('companyDisplay').textContent = 'Company: ' + companyRaw;
      document.getElementById('dateDisplay').textContent = 'Date: ' + formatDateLabel(selectedDate);

      let fans = [];
      try {
        fans = JSON.parse(fansJSON);
      } catch (e) {
        console.error('Error parsing fansServiced:', e);
        alert('Fan data corrupted. Please choose date again.');
        window.location.href = 'date-selection.html';
        return;
      }

      const grid = document.getElementById('fanGrid');
      grid.innerHTML = '';
      if (fans.length === 0) {
        grid.innerHTML = '<p>No fans serviced on this date.</p>';
        return;
      }
      fans.forEach(f => {
        const div = document.createElement('div');
        div.className = 'fan-btn';
        div.innerHTML = `<strong>${f}</strong><div style="margin-top:8px;">View report →</div>`;
        div.addEventListener('click', () => viewReport(f));
        grid.appendChild(div);
      });
    });
  </script>
</body>
</html>
