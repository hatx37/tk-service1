<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Service Date - Service Maintenance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="password-page">
    <!-- Header Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="images/logo.png" alt="TK FANTASTIC Logo" class="logo-img" style="height: 50px;">
                </div>
                <nav class="nav-desktop">
                    <a href="index.html#hero" class="nav-link">Home</a>
                    <a href="index.html#service" class="nav-link">Service Report</a>
                    <a href="index.html#contact" class="nav-link">Contact Us</a>
                </nav>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <nav class="nav-mobile" id="mobileMenu">
                <a href="index.html#hero" class="nav-link">Home</a>
                <a href="index.html#service" class="nav-link">Service Report</a>
                <a href="index.html#contact" class="nav-link">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- Date Selection Section -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="container">
            <div class="password-container" style="max-width: 900px;">
                <h1 class="title" style="font-size: 2.5rem; margin-bottom: 1rem;">📅 Select Service Date</h1>
                <p class="company-name" id="companyDisplay" style="font-size: 1.3rem; font-weight: 600;">Loading...</p>

                <!-- Last & Next Service Dates -->
                <div class="date-section">
                    <div class="service-history">
                        <div class="history-card">
                            <div class="history-icon">📅</div>
                            <div class="history-info">
                                <p>Last Service Date</p>
                                <p id="lastServiceDate">-</p>
                            </div>
                        </div>
                        <div class="history-card">
                            <div class="history-icon">🔔</div>
                            <div class="history-info">
                                <p>Next Service Date</p>
                                <p id="nextServiceDate">-</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Available Service Dates -->
                <div class="available-dates">
                    <p style="text-align: center; color: white; font-size: 1.2rem; margin-bottom: 1.5rem;">
                        📋 Click on a date to view service reports
                    </p>
                    <div id="dateList" class="dates-list"></div>
                </div>

                <button class="back-button" onclick="window.location.href='password.html'" style="margin-top: 1.5rem;">
                    ← BACK TO PASSWORD
                </button>
            </div>
        </div>
    </section>

    <script src="company-data.js"></script>
    <script>
        // ==================== MOBILE MENU ====================
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        if (mobileMenuBtn && mobileMenu) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('active');
            });
        }

        // ==================== NORMALIZE COMPANY NAME ====================
        function normalizeCompany(name) {
            return (name || '').trim().toUpperCase();
        }

        // ==================== PAGE INITIALIZATION ====================
        const rawCompany = localStorage.getItem('companyName') || localStorage.getItem('selectedCompany');
        
        console.log('🔍 Raw company from localStorage:', rawCompany);
        
        if (!rawCompany) {
            alert('No company selected. Returning to start.');
            window.location.href = 'index.html';
        }

        const companyKey = normalizeCompany(rawCompany);
        document.getElementById('companyDisplay').textContent = rawCompany;

        console.log('🔍 Looking for company:', companyKey);
        console.log('🔍 Available companies:', Object.keys(companyReportLinks || {}));

        if (typeof companyReportLinks === 'undefined') {
            alert('Company data not loaded. Make sure company-data.js is loaded.');
            throw new Error('companyReportLinks missing');
        }

        // Try both normalized and original company name
        const companyReports = companyReportLinks[companyKey] || companyReportLinks[rawCompany];
        
        // Get service dates info
        const companyInfo = companyServiceData[companyKey] || companyServiceData[rawCompany] || {};
        
        console.log('✅ Company reports found:', companyReports);
        console.log('✅ Company info:', companyInfo);

        // Display Last & Next Service Dates
        const lastDate = companyInfo.lastServiceDate || 'N/A';
        const nextDate = companyInfo.nextServiceDate || 'N/A';
        
        document.getElementById('lastServiceDate').textContent = lastDate;
        document.getElementById('nextServiceDate').textContent = nextDate;

        console.log('📅 Last service:', lastDate);
        console.log('🔔 Next service:', nextDate);

        // ==================== DISPLAY SERVICE DATES ====================
        if (!companyReports) {
            document.getElementById('dateList').innerHTML = '<div class="error-message">No service dates found for this company.</div>';
        } else {
            // Create sorted date array (descending - newest first)
            const dates = Object.keys(companyReports).sort((a, b) => {
                const da = new Date(a).getTime();
                const db = new Date(b).getTime();
                if (isNaN(da) && isNaN(db)) return a.localeCompare(b);
                if (isNaN(da)) return 1;
                if (isNaN(db)) return -1;
                return db - da; // Descending
            });

            console.log('📅 Available service dates:', dates);

            const dateList = document.getElementById('dateList');

            dates.forEach(dateKey => {
                const button = document.createElement('button');
                button.className = 'date-item';
                
                // Format date nicely
                let label = dateKey;
                const parsed = new Date(dateKey);
                if (!isNaN(parsed.getTime())) {
                    label = parsed.toLocaleDateString('en-GB', { 
                        day: '2-digit', 
                        month: 'long', 
                        year: 'numeric' 
                    });
                }
                
                // Count how many fans were serviced
                const fansCount = Object.keys(companyReports[dateKey]).length;
                
                button.innerHTML = `
                    <span>📅 ${label}</span>
                    <span>${fansCount} fan${fansCount !== 1 ? 's' : ''} serviced</span>
                `;
                
                button.addEventListener('click', () => {
                    console.log('✅ Selected date:', dateKey);
                    const fans = Object.keys(companyReports[dateKey]);
                    localStorage.setItem('selectedServiceDate', dateKey);
                    localStorage.setItem('fansServiced', JSON.stringify(fans));
                    window.location.href = 'fan-selection.html';
                });
                
                dateList.appendChild(button);
            });
        }
    </script>
</body>
</html>
